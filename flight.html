<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142b34" />
    <title>Slipstream · Harbor time trial</title>
  </head>
  <body>
    <main id="game">
      <div id="scene" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <header class="top">
        <a href="./flight.html" class="wordmark">SLIPSTREAM</a>
        <button id="sound" type="button" aria-pressed="false">Sound off</button>
      </header>
      <section id="brief" class="brief" aria-labelledby="title">
        <p class="eyebrow">TIME TRIAL / 01</p>
        <h1 id="title">Harbor<br />Run</h1>
        <p id="intro">
          Fly through seven gates above the waterfront. Release thrust to carry speed into a turn.
        </p>
        <button id="launch" type="button">Launch <kbd>Enter</kbd></button>
      </section>
      <section id="hud" class="hud" aria-label="Flight instruments" hidden>
        <div class="split">
          <span id="route">GATE 01 / 07</span><strong id="time">00:00.00</strong><span id="best"></span>
        </div>
        <div id="marker" aria-hidden="true"><span id="marker-arrow"></span><span id="meters"></span></div>
        <div class="instruments">
          <div><span>GROUND SPEED</span><strong id="speed">0</strong><span>KM/H</span></div>
          <div><span>ALTITUDE</span><strong id="altitude">36</strong><span>M</span></div>
        </div>
        <p id="notice" role="status"></p>
      </section>
      <footer class="controls" aria-label="Keyboard controls">
        <span><kbd>W</kbd> Thrust</span>
        <span><kbd>A</kbd><kbd>D</kbd> Turn</span>
        <span><kbd>Space</kbd><kbd>C</kbd> Climb / dive</span>
        <span><kbd>Shift</kbd> Boost</span>
        <span><kbd>S</kbd> Brake</span>
        <span><kbd>R</kbd> Reset</span>
      </footer>
      <div id="touch" class="touch" hidden aria-label="Touch flight controls">
        <div>
          <button data-key="KeyA" aria-label="Turn left">←</button
          ><button data-key="KeyD" aria-label="Turn right">→</button><button data-key="Space">Climb</button
          ><button data-key="KeyC">Dive</button>
        </div>
        <div>
          <button data-key="KeyW">Thrust</button><button data-key="ShiftLeft">Boost</button
          ><button data-key="KeyS">Brake</button><button id="touch-reset" type="button">Reset</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/flight/main.ts"></script>
  </body>
</html>

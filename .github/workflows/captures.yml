name: Captures

on:
  pull_request:
    paths:
      - 'src/**'
      - '!src/stages/*/**'
      - 'src/stages/battlefield/**'
      - '!src/**/*.test.ts'
      - 'index.html'
      - 'lab.html'
      - 'public/**'
      - '!public/audio/**'
      - 'scripts/capture.ts'
      - 'scripts/lib/**'
      - 'e2e/capture.spec.ts'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/captures.yml'
  workflow_dispatch:

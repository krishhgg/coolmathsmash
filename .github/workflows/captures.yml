name: Captures

on:
  pull_request:
    paths:
      - 'src/**'
      - '!src/**/*.test.ts'
      - 'index.html'
      - 'lab.html'
      - 'public/**'
      - '!public/audio/**'
      - 'scripts/capture.ts'
      - 'scripts/lib/**'
      - '!scripts/**/*.test.ts'
      - 'e2e/capture.spec.ts'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/captures.yml'
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

concurrency:
  group: captures-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: Capture named scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find changed paths on the PR merge commit
        if: github.event_name == 'pull_request'
        run: |
          paths="$RUNNER_TEMP/capture-paths"
          if git rev-parse --verify --quiet HEAD^2 >/dev/null &&
             git diff --no-renames --name-only -z HEAD^1 HEAD -- > "$paths"; then
            exit 0
          fi
          rm -f "$paths"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --with-deps --only-shell chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture the affected scenarios
        run: |
          args=()
          if [[ -s "$RUNNER_TEMP/capture-paths" ]]; then
            args+=(--changed-files "$RUNNER_TEMP/capture-paths")
          fi
          npm run capture -- --build --out captures/ci "${args[@]}"
      - name: Captures are byte-identical across runs (e2e/capture.spec.ts)
        run: |
          check=$(jq '(.scoped != true) or any(.scenarios[]; .name == "idle" or .name == "jump-apex" or .name == "hud")' captures/ci/manifest.json)
          if [[ "$check" == true ]]; then
            npx playwright test e2e/capture.spec.ts --grep "byte-identical PNGs"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-${{ github.event.pull_request.head.sha || github.sha }}
          path: captures/ci
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-captures
          path: |
            playwright-report
            test-results
          retention-days: 7
